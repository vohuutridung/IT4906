# EvoPrompt DE — Medical Findings Generation (Stage 1, paper ViX-Ray)
# Mọi tham số quan trọng đều ở đây — các mục ghi "chốt tạm" đổi được 1 dòng.

seed: 5  # official default (set_seed toàn cục: random + numpy + torch)

data:
  dataset_id: "MilitaryHospital175/VNMedical_bv175"
  dataset_dir: null  # Tùy chọn: thư mục Parquet có sẵn sẽ được ưu tiên.
  split: "val"
  num_samples: 200  # 200 sample ĐẦU của val (thứ tự parquet gốc — cần xác nhận nhóm)

target_llm:  # Model nhỏ sinh Findings để đánh giá prompt
  model_id: "google/medgemma-1.5-4b-it"
  batch_size: 4           # T4 + bf16: KV cache lớn theo batch — 4 an toàn VRAM (GPU ≥24GB có thể trả lại 16)
  max_new_tokens: 128     # official default
  # ⚠️ T4 KHÔNG chạy được fp16 cho MedGemma/Gemma3 (logits NaN → output rỗng — đã chẩn đoán 2026-11-11).
  # bf16 emulated trên T4 chạy ĐÚNG (đã test thực tế). L4/A100 → bf16 native.
  dtype: "bfloat16"
  do_sample: false        # greedy cho đánh giá (nếu nhóm xác định official dùng sampling thì đổi)

fitness:  # 0.7 × BERTScore + 0.3 × ROUGE-L — chốt tạm 2026-11-10, SWAPPABLE
  bertscore_model: "xlm-roberta-large"  # đổi model khác chỉ cần sửa dòng này + re-score cache
  bertscore_lang: null                  # đặt "vi" nếu muốn dùng rescale baseline theo lang
  rouge_type: "rougeL"
  rouge_use_stemmer: false              # stemmer chỉ hỗ trợ tiếng Anh
  weight_bertscore: 0.7
  weight_rouge: 0.3
  batch_size: 16                        # giảm để an toàn VRAM khi chung GPU với model khác
  bertscore_bf16: true                  # nhả ~1GiB VRAM GPU1 cho 27B; F1 lệch <0.5% (đồng nhất mọi prompt); đổi → fingerprint tự tách cache
  # device: "cuda:1"                    # để trống = tự chọn (≥2 GPU → cuda:1; OOM → tự rơi về CPU)

evolution_llm:  # Model lớn lai ghép + đột biến prompt
  # "openai" = gọi endpoint OpenAI-compatible qua OpenAI(base_url, api_key) — chỉ dẫn
  #   Dũng 2026-11-13; giá trị thật nằm trong file .env (KHÔNG hardcode, đã git-ignore).
  # "openrouter" = gọi OpenRouter bằng OPENROUTER_API_KEY, mặc định openai/gpt-oss-20b.
  # "local"  = load model bằng transformers (path cũ, không cần endpoint).
  provider: "openai"
  # null dùng model mặc định của provider. Có thể ghi đè bằng --evolution-model-id.
  model_id: null
  # Tên BIẾN MÔI TRƯỜNG chứa thông tin endpoint — giá trị thật điền trong .env
  # (copy từ .env.example). Đổi tên biến chỉ khi nhóm chốt naming chung.
  base_url_env: "EVOLUTION_LLM_BASE_URL"
  api_key_env: "EVOLUTION_LLM_API_KEY"
  load_in_4bit: true     # chỉ dùng khi provider=local — bắt buộc cho Kaggle 2×T4 (16GB/GPU)
  bnb_compute_dtype: "bfloat16"  # fp16 gây NaN cho Gemma3 (đã chẩn đoán 2026-11-11); T4 chạy bf16 emulated OK
  dtype: "bfloat16"      # chỉ dùng khi provider=local và load_in_4bit=false
  max_new_tokens: 1500   # ⚠️ LỆCH official 1000 — cần báo nhóm. 2026-11-12: 27B trích dẫn
                         # nguyên văn donors trong 4 bước → trần 1000 cắt TRƯỚC thẻ
                         # <prompt> → fallback = text phân tích (offspring rác 0.58).
                         # Template cấm trích-dẫn + trần 1500; VRAM an toàn: sliding_window
                         # 1024 chặn KV ~0.65GiB, không tăng theo độ dài decode.
  temperature: 0.5       # official default
  top_p: 0.95            # official default (nucleus)

de:
  population_size: 10    # N — theo file TTTH
  iterations: 10         # T — theo file TTTH, không early stopping
  initial_mode: "human"  # human | gpt | random | top | bottom
  donor_random: false    # Prompt 3 = best prompt (theo file TTTH + code gốc template v1)
  pool_files:            # Theo thứ tự: file human, file GPT. random/top/bottom dùng chung cả hai.
    - "data/med_findings_gen/prompts.txt"
    - "data/med_findings_gen/prompts_auto.txt"
  cache_dir: "runs/de"   # checkpoint + cache; Kaggle: /kaggle/working/runs/de
